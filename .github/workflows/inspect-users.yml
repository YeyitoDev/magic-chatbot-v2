name: "🔎 Inspeccionar Usuarios (compras/subs)"

on:
  workflow_dispatch:
    inputs:
      user_ids:
        description: "IDs de Telegram separados por coma"
        required: true
        default: "5725620985,8717340999,8023070863,6681650046"
        type: string
      create_subs:
        description: "Crear suscripciones faltantes (repara compras VIP sin sub)"
        required: true
        default: false
        type: boolean
      kick_out:
        description: "Expulsar (kick) a quienes NO tengan VIP vigente"
        required: true
        default: false
        type: boolean

jobs:
  inspect-users:
    runs-on: ubuntu-latest
    # Solo en el repo operativo (el repo público no tiene secretos).
    if: github.repository == 'YeyitoDev/magic-services'
    permissions:
      contents: read
    environment: production

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env
        run: |
          cat > .env << EOF
          ENVIRONMENT=production
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_NOTIFY_IDS=${{ secrets.ADMIN_NOTIFY_IDS }}
          PROTECTED_USER_IDS=${{ secrets.PROTECTED_USER_IDS }}
          TELEGRAM_VIP_GROUP_ID=${{ secrets.TELEGRAM_VIP_GROUP_ID }}
          TELEGRAM_VALIDATOR_IDS=${{ secrets.TELEGRAM_VALIDATOR_IDS }}
          DB_ENGINE=mysql+pymysql
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_HOST=${{ secrets.DB_HOST }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_PORT=3306
          TIMEZONE=America/Lima
          EOF

      - name: Inspeccionar usuarios
        env:
          USER_IDS: ${{ github.event.inputs.user_ids }}
          CREATE_SUBS: ${{ github.event.inputs.create_subs }}
          KICK_OUT: ${{ github.event.inputs.kick_out }}
        run: |
          python scripts/inspect_users.py > /tmp/inspect_report.txt 2>&1 || true
          cat /tmp/inspect_report.txt

      - name: Send report via Telegram
        if: always()
        run: |
          REPORT=$(cat /tmp/inspect_report.txt)
          if [ ${#REPORT} -gt 4000 ]; then
            REPORT="${REPORT:0:4000}"$'\n\n''... (truncado, ver logs del workflow)'
          fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.ADMIN_CHAT_ID }}" \
            --data-urlencode "text=${REPORT}" || true
